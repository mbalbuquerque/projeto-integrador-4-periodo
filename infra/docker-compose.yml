# API do ColdTrack em contêiner, com emulador do Cosmos DB, reinício automático e verificação de saúde.
# Uso (da raiz do repositório):
#   cp .env.example .env     # e preencher: os valores do emulador estão no passo ".env" de
#                            # .github/workflows/compose-zap.yml
#   docker compose -f infra/docker-compose.yml up --build
#   python infra/ci/preparar_banco.py    # uma vez: cria o banco, os containers e um usuário de teste
# A API sobe em http://localhost:7071/api (ex.: /api/health, /api/docs).
# Teste automatizado (subida, saúde, reinício, ZAP): workflow "Compose e ZAP" no GitHub Actions.
services:
  cosmos:
    # Emulador oficial do Cosmos DB para Linux, em HTTP (sem certificado autoassinado).
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "http"]
    ports:
      - "8081:8081"
    restart: unless-stopped

  api:
    build:
      context: ../cloud/function
      dockerfile: ../../infra/Dockerfile
    env_file: ../.env
    ports:
      - "7071:80"
    depends_on:
      - cosmos
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
