name: Testes

# Roda a cada push e pull request: testes da API e compilação do firmware.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, testes de contrato e segurança)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/function
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/function/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov time-machine hypothesis coverage pandas matplotlib

      - name: Lint (ruff, regras em pyproject.toml)
        run: |
          pip install ruff==0.17.4
          ruff check .

      - name: Rodar testes da API (com cobertura)
        run: pytest --cov=. --cov-branch --cov-report=term-missing --cov-fail-under=98

      - name: Rodar testes da analise climatica
        run: pytest ../../analise -v

  firmware:
    name: Firmware (testes unitários C++ e compilação ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar testes unitários do firmware (C++)
        run: |
          g++ -O2 -Wall firmware/tests/test_firmware.cpp -o run_tests_firmware
          ./run_tests_firmware

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar placa ESP32 e bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "DHT sensor library" "Adafruit Unified Sensor"

      # secrets.h real nunca está no repositório; o modelo basta para compilar.
      # A pasta precisa ter o mesmo nome do .ino (coldtrack/coldtrack.ino).
      - name: Preparar sketch
        run: |
          mkdir -p build/coldtrack
          cp firmware/coldtrack/coldtrack.ino firmware/coldtrack/azure_ca.h firmware/coldtrack/payload_core.h build/coldtrack/
          cp firmware/coldtrack/secrets.example.h build/coldtrack/secrets.h

      - name: Compilar (DHT22, simulação)
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 build/coldtrack

      - name: Compilar (DHT11, placa física)
        run: |
          echo '#define DHT_TYPE DHT11' >> build/coldtrack/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32c3 build/coldtrack
