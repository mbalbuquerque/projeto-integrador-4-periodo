name: Segurança

# Verificação de dependências e varredura passiva do ZAP contra a API publicada.
# Roda sob demanda, toda segunda-feira e quando as dependências mudam na main.
# O relatório do ZAP fica como artefato da execução.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "cloud/function/requirements.txt"
      - ".github/workflows/seguranca.yml"

permissions:
  contents: read

jobs:
  dependencias:
    name: Dependências da API (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Procurar vulnerabilidades conhecidas
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r cloud/function/requirements.txt

  zap:
    name: Varredura ZAP (baseline, passiva)
    runs-on: ubuntu-latest
    steps:
      - name: Rodar o ZAP baseline na documentação da API
        run: |
          mkdir -p zap && chmod 777 zap
          # -I: avisos não derrubam o job; só falha se o ZAP não conseguir rodar.
          docker run --rm -v "$PWD/zap:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://func-coldtrack-7319.azurewebsites.net/api/docs \
            -r relatorio-zap.html -w relatorio-zap.md -I

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-zap-api
          path: zap/
