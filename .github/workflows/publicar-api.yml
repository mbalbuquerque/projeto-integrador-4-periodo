name: Publicar API

# A cada push na branch everson que mexa na API: testa e publica no Azure.
# Login no Azure por OIDC (sem senha guardada): a identidade só é aceita
# para esta branch deste repositório e só enxerga o grupo rg-coldtrack.
on:
  push:
    branches: [everson]
    paths:
      - "cloud/function/**"
      - ".github/workflows/publicar-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publicar-api
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/function
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud/function/requirements.txt

      - name: Testes (a publicação só acontece se passarem)
        run: |
          pip install -r requirements.txt
          python -m unittest

      - name: Empacotar
        run: zip publicar.zip function_app.py contrato.py seguranca.py cadastros.py host.json requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar na Azure Function
        run: |
          az functionapp deployment source config-zip \
            -g rg-coldtrack -n func-coldtrack-7319 \
            --src publicar.zip --build-remote true
