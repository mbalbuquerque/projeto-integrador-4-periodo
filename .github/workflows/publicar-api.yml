name: Publicar API

# A cada push na branch main que mexa na API: testa e publica no Azure.
# Login no Azure por OIDC (sem senha guardada): a identidade só é aceita
# para as branches main e everson deste repositório e só enxerga o grupo
# rg-coldtrack. A everson não dispara mais a publicação, para o mesmo código
# não ser publicado duas vezes; a credencial dela fica como reserva.
on:
  push:
    branches: [main]
    paths:
      - "cloud/function/**"
      - ".github/workflows/publicar-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publicar-api
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/function
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            cloud/function/requirements.txt
            cloud/function/requirements-dev.txt

      - name: Testes (a publicação só acontece se passarem)
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m unittest

      # Mesma lista do publicar.sh (pacote.txt); o test_pacote.py a confere.
      - name: Empacotar
        run: |
          grep -v -e '^#' -e '^[[:space:]]*$' pacote.txt | zip publicar.zip -@
          unzip -l publicar.zip

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar na Azure Function
        run: |
          az functionapp deployment source config-zip \
            -g rg-coldtrack -n func-coldtrack-7319 \
            --src publicar.zip --build-remote true

      # Verificação de saúde depois da publicação: a rota consulta o banco.
      # Tenta por até 3 minutos (a função reinicia com o pacote novo).
      - name: Conferir /api/health
        run: |
          for i in $(seq 1 18); do
            codigo=$(curl -s -o saude.json -w "%{http_code}" https://func-coldtrack-7319.azurewebsites.net/api/health || true)
            if [ "$codigo" = "200" ]; then cat saude.json; exit 0; fi
            echo "tentativa $i: HTTP $codigo"; sleep 10
          done
          echo "::error::/api/health não respondeu 200 depois da publicação"; exit 1
